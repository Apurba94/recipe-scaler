[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-scaler"
version = "0.1.0"
description = "Scale buffer and media recipes to target volumes with unit handling."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
recipe-scaler = "recipe_scaler.cli:main"

[tool.setuptools]
packages = ["recipe_scaler"]
